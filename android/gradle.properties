org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.enableJetifier=true

# The project is on D: while Flutter plugins are cached on C:. Kotlin's
# incremental cache cannot relativize files across Windows drive roots.
kotlin.incremental=false

# file_picker still applies the legacy Kotlin Gradle Plugin. Keep this off
# until every Android plugin in the dependency graph supports built-in Kotlin.
android.builtInKotlin=false
# Keep the Flutter compatibility bridge enabled while plugins migrate to the
# AGP 9 DSL. Remove both flags after the dependency graph is fully migrated.
android.newDsl=false
